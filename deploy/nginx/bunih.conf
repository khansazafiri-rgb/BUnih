# ---------------------------------------------------------------------------
# nginx untuk BUnih. Letakkan di /etc/nginx/conf.d/bunih.conf
# Ganti keuangan.contoh.id dengan domainmu, lalu jalankan certbot.
#
# Jika Hermes sudah memakai nginx yang sama, cukup TAMBAHKAN server block ini;
# jangan ubah server block milik Hermes.
# Blok limit_req_zone harus berada di konteks http (lihat docs/06-pasang-tencent.md).
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=bunih_masuk:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name keuangan.contoh.id;

    # Biarkan certbot memverifikasi domain.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name keuangan.contoh.id;

    ssl_certificate     /etc/letsencrypt/live/keuangan.contoh.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keuangan.contoh.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Unggahan CSV mutasi bisa cukup besar.
    client_max_body_size 25m;

    access_log /var/log/nginx/bunih.access.log;
    error_log  /var/log/nginx/bunih.error.log;

    # Batasi percobaan masuk.
    location = /api/masuk {
        limit_req zone=bunih_masuk burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
