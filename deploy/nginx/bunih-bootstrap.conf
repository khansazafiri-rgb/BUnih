# BOOTSTRAP ONLY: use this BEFORE issuing the first TLS certificate.
# This file does not reference missing /etc/letsencrypt certificate files.
# Use only when nginx on the HOST already owns port 80; never replace Hermes proxy.
server {
    listen 80;
    listen [::]:80;
    server_name keuangan.contoh.id;

    # Certbot --webroot writes HTTP-01 challenges here.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Never expose financial app over plain HTTP.
    location / {
        return 404;
    }
}
